  <rect x="40" y="550" width="520" height="90" rx="12" fill="#E8F6EC" stroke="#286C4C" stroke-width="2"/>
  <text x="300" y="587" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">PROMOTE IF</text>
  <text x="300" y="608" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Problem improves; quality and ownership hold</text>
  <line x1="80" y1="640" x2="80" y2="660" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="660" width="520" height="90" rx="12" fill="#FFEEEC" stroke="#943030" stroke-width="2"/>
  <text x="300" y="697" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">ROLLBACK IF</text>
  <text x="300" y="718" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Bad count · attribution · mutation · latency · pub state</text>
  <rect x="590" y="110" width="770" height="640" rx="12" fill="#fff" stroke="#2A3648" stroke-width="2"/>
  <rect x="590" y="110" width="770" height="48" fill="#162A44"/>
  <text x="975" y="140" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Non-negotiable x333 contract</text>
  <text x="620" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">1. Exact 333-character output contract</text>
  <text x="620" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">2. Quote fidelity and attribution preserved</text>
  <text x="620" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">3. Passage-grounded insight only</text>
  <text x="620" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">4. No browsing</text>
  <text x="620" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">5. No skill mutation by the running model</text>
  <text x="620" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">6. Unpublished handoff state remains unpublished</text>
  <text x="620" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">7. User-owned skill cannot be curator-patched</text>
  <text x="620" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">8. Draft / validated / handed-off / approved / published stay distinct</text>
  <text x="620" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">9. One ordinary user result — never parallel baseline + candidate</text>
  <text x="620" y="650" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1C2026">10. Self-evaluation after every promoted change</text>
  <text x="700" y="790" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4E5660">Issue #30 origin: unauthorized skill_manage against a user-owned skill. Not runtime authorization.</text>
