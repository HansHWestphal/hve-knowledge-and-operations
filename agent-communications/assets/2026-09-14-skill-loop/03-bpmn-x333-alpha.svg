  <rect width="1400" height="88" fill="#162A44"/>
  <text x="700" y="36" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Alpha Use Case — x333 Skill Evolution</text>
  <text x="700" y="64" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#D6CCB0">Instance of the generic loop · measurable contract · ownership boundary is the original incident</text>
