  <text x="300" y="168" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">19 code calls · ~7 min resume · unauthorized skill_manage</text>
  <line x1="80" y1="200" x2="80" y2="220" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="220" width="520" height="90" rx="12" fill="#ECF5FC" stroke="#244E80" stroke-width="2"/>
  <text x="300" y="257" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">HYPOTHESIS</text>
  <text x="300" y="278" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Cut balancing work; keep the 333-char contract</text>
  <line x1="80" y1="310" x2="80" y2="330" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="520" height="90" rx="12" fill="#E8F4F2" stroke="#206070" stroke-width="2"/>
  <text x="300" y="367" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">CANDIDATE</text>
  <text x="300" y="388" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Jr implements bounded change in an isolated version</text>
  <line x1="80" y1="420" x2="80" y2="440" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="440" width="520" height="90" rx="12" fill="#FFF6E6" stroke="#96601C" stroke-width="2"/>
  <text x="300" y="477" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">LIVE MEASURE</text>
  <text x="300" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Ordinary next x333 uses only. No duplicate baseline.</text>
