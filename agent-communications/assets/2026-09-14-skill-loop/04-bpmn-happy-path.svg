<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="Happy path">
  <rect width="1400" height="420" fill="#F7F5F0"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A3648"/>
    </marker>
  </defs>
  <rect width="1400" height="88" fill="#162A44"/>
  <text x="700" y="36" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Happy Path — Autonomous Low-Risk Skill Evolution</text>
  <text x="700" y="64" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#D6CCB0">BPMN 2.0 sequence · standing autonomy only · human is off the path</text>
  <rect x="30" y="160" width="155" height="100" rx="12" fill="#E8F6EC" stroke="#2A3648" stroke-width="2"/>
  <text x="107.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">1. Observe</text>
  <text x="107.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Rolling production</text>
  <text x="107.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">evidence</text>
  <line x1="185" y1="210" x2="200" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="160" width="155" height="100" rx="12" fill="#ECF5FC" stroke="#2A3648" stroke-width="2"/>
  <text x="277.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">2. Hypothesize</text>
  <text x="277.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Named problem</text>
  <text x="277.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">+ metric</text>
  <line x1="355" y1="210" x2="370" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="160" width="155" height="100" rx="12" fill="#FFF6E6" stroke="#2A3648" stroke-width="2"/>
  <text x="447.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">3. Authorize</text>
  <text x="447.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">In-policy</text>
  <text x="447.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">request</text>
  <line x1="525" y1="210" x2="540" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="160" width="155" height="100" rx="12" fill="#E8F4F2" stroke="#2A3648" stroke-width="2"/>
  <text x="617.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">4. Implement</text>
  <text x="617.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Isolated Jr</text>
  <text x="617.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">candidate</text>
  <line x1="695" y1="210" x2="710" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="710" y="160" width="155" height="100" rx="12" fill="#E8F4F2" stroke="#2A3648" stroke-width="2"/>
  <text x="787.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">5. Prove</text>
  <text x="787.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Contract +</text>
  <text x="787.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">safety checks</text>
  <line x1="865" y1="210" x2="880" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="160" width="155" height="100" rx="12" fill="#FFF4EA" stroke="#2A3648" stroke-width="2"/>
  <text x="957.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">6. Canary</text>
  <text x="957.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">One ordinary</text>
  <text x="957.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">live use</text>
  <line x1="1035" y1="210" x2="1050" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1050" y="160" width="155" height="100" rx="12" fill="#E8F6EC" stroke="#2A3648" stroke-width="2"/>
  <text x="1127.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">7. Decide</text>
  <text x="1127.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Promote or</text>
  <text x="1127.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">rollback</text>
  <line x1="1205" y1="210" x2="1220" y2="210" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1220" y="160" width="155" height="100" rx="12" fill="#FFF6E6" stroke="#2A3648" stroke-width="2"/>
  <text x="1297.5" y="194" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">8. Learn</text>
  <text x="1297.5" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Durable record</text>
  <text x="1297.5" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">+ eval</text>
  <circle cx="50" cy="130" r="16" fill="#fff" stroke="#286C4C" stroke-width="3"/>
  <text x="50" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#4E5660">Skill used</text>
  <circle cx="1350" cy="130" r="16" fill="#fff" stroke="#286C4C" stroke-width="6"/>
  <text x="1350" y="164" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#4E5660">Evolved</text>
  <line x1="50" y1="146" x2="50" y2="160" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1350" y1="160" x2="1350" y2="146" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M107 260 L107 310 L1325 310 L1325 260" fill="none" stroke="#2A3648" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="340" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4E5660">Loop: updated rolling evidence is the next baseline. No parallel A/B output to the user.</text>
  <rect x="40" y="355" width="1320" height="50" rx="12" fill="#fff" stroke="#2A3648" stroke-width="2"/>
  <text x="700" y="380" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1C2026">Any failed gate ends with the current skill unchanged and an audit record. Autonomy is the absence of a human task on this path — not the absence of gates.</text>
</svg>
